name: build-linux-client

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build FiveM five release for Wine
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      PROGRAM: five
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'
    steps:
      - name: Checkout this repo/branch to C-drive (fork-agnostic)
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REF_NAME: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /c/b && cd /c/b
          git init .
          git config core.symlinks true
          # Build THIS repo at the branch the workflow was dispatched on (works on any fork).
          # GitHub's git endpoint wants Basic auth (x-access-token:<token>), like
          # actions/checkout uses; a 'bearer' header is rejected and git falls back to
          # a username prompt, which fails in CI.
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git remote add origin "$REPO_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" pull origin "$REF_NAME" --depth=1
          git submodule update --jobs=8 --init --depth=1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup MSVC developer environment (adds MSBuild + VSINSTALLDIR for node-gyp)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Generate and build five release
        shell: bash
        run: |
          cd /c/b
          python -m pip install setuptools || py -m pip install setuptools || true
          pwsh ./fxd.ps1 get-chrome
          ./prebuild.cmd
          pwsh ./fxd.ps1 gen -game five
          cd code/build/five
          MSBuild.exe CitizenMP.sln -t:build -restore -p:RestorePackagesConfig=true -p:preferredtoolarchitecture=x64 -p:configuration=release -p:WindowsTargetPlatformVersion=10.0.22621.0 -maxcpucount:4 -v:m -fl1 "-flp1:logfile=errors.log;errorsonly" || { echo '=== errors.log ==='; cat errors.log 2>/dev/null | tail -120; exit 1; }

      - name: Assemble runnable layout (postbuild, CI cleared)
        shell: pwsh
        env:
          CI: ''
        run: |
          Set-Location C:\b
          $L = "C:\b\code\bin\five\release"
          # postbuild runs with 'Continue' exactly as before (it tolerates non-fatal
          # errors); everything after it stops on errors, and the layout is validated.
          $ErrorActionPreference = 'Continue'
          Write-Host "=== running run_postbuild.ps1 (UI build + layout) ==="
          try {
            & .\code\tools\build\run_postbuild.ps1 -LayoutDir $L -Game five -Configuration release
          } catch {
            Write-Host "::warning::postbuild threw (continuing with fallback copies, layout is validated below): $_"
          }
          $ErrorActionPreference = 'Stop'
          Write-Host "=== fallback: ensure critical static layout present ==="
          New-Item -ItemType Directory -Force "$L\bin"     | Out-Null
          New-Item -ItemType Directory -Force "$L\bin\cef" | Out-Null
          New-Item -ItemType Directory -Force "$L\citizen" | Out-Null
          Copy-Item -Force -Recurse data\shared\*   "$L\" -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse data\client\*   "$L\" -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse data\launcher\* "$L\" -ErrorAction SilentlyContinue
          $cef = Get-ChildItem vendor -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'cef*' } | Select-Object -First 1
          if ($cef) {
            Write-Host "CEF at $($cef.FullName)"
            Copy-Item -Force "$($cef.FullName)\Release\*.dll" "$L\bin\" -ErrorAction SilentlyContinue
            Copy-Item -Force "$($cef.FullName)\Release\*.bin" "$L\bin\" -ErrorAction SilentlyContinue
            Copy-Item -Force "$($cef.FullName)\Resources\icudtl.dat" "$L\bin\" -ErrorAction SilentlyContinue
            Copy-Item -Force "$($cef.FullName)\Resources\*.pak" "$L\bin\cef\" -ErrorAction SilentlyContinue
            Copy-Item -Force "$($cef.FullName)\Resources\locales\en-US.pak" "$L\bin\cef\" -ErrorAction SilentlyContinue
          } else { Write-Host "::warning::no CEF dir found in vendor (validation below decides)" }
          # NOTE: never strip 'adhesive' or 'sticky' from components.json. Public builds list
          # 'sticky'; if 'adhesive' is listed, the client swaps it for 'sticky' under Wine
          # (ComponentLoader.cpp) and shows an "Insecure mode" notice.
          # ---- fail closed: validate the runnable layout -----------------------
          # Required by the Linux runtime (scripts/install.sh, scripts/launch.sh):
          # FiveM.exe, components.json listing the Wine anti-cheat stub ('sticky', or 'adhesive' which the client swaps for sticky under Wine),
          # citizen/ui.zip (NUI/menu), CEF runtime (bin/libcef.dll + bin/icudtl.dat).
          $required = @(
            'FiveM.exe',
            'components.json',
            'citizen\ui.zip',
            'bin\libcef.dll',
            'bin\icudtl.dat'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $L $_) -PathType Leaf) })
          if ($missing.Count -gt 0) {
            foreach ($m in $missing) { Write-Host "::error::required output missing: $m" }
            exit 1
          }
          $comp = Get-Content -Raw -LiteralPath "$L\components.json" | ConvertFrom-Json
          if (-not ($comp -is [System.Array]) -or $comp.Count -eq 0) { Write-Host '::error::components.json is not a non-empty list'; exit 1 }
          # Public-source builds list 'sticky' directly (code/components/config.lua); 'adhesive' is a
          # private Cfx component that only official builds ship. Either one satisfies the loader.
          if ($comp -notcontains 'sticky' -and $comp -notcontains 'adhesive') { Write-Host "::error::components.json lists neither 'sticky' nor 'adhesive' (the client needs one of them to start under Wine)"; exit 1 }
          $paks = @(Get-ChildItem -LiteralPath "$L\bin\cef" -Filter *.pak -ErrorAction SilentlyContinue)
          if ($paks.Count -eq 0) { Write-Host '::warning::no CEF .pak resources found in bin\cef' }
          # informational (documented postbuild outputs; not hard requirements)
          foreach ($o in @('citizen\ros', 'data')) {
            if (-not (Test-Path -LiteralPath (Join-Path $L $o))) { Write-Host "::warning::postbuild output not found: $o" }
          }
          Write-Host "=== layout validated: all required outputs present ==="

      - name: List build output
        if: always()
        shell: bash
        run: |
          echo "=== code/bin/five ==="
          ls -la /c/b/code/bin/five 2>/dev/null || echo "no bin/five"
          echo "=== release listing ==="
          ls /c/b/code/bin/five/release 2>/dev/null | head -80 || echo "no release dir"

      - name: Upload client artifact (only after a successful build + validation)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fivem-five-release
          path: 'C:\b\code\bin\five\release'
          if-no-files-found: error
          retention-days: 3
